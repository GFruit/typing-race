    // If we already have a remembered avatar, show it right away; otherwise
    // the server's random assignment lands via render() a moment after connect.
    if (myEmoji) emojiBtn.textContent = myEmoji;

    // Recently-used avatars: a small MRU list persisted in localStorage,
    // surfaced as the picker's first group so your go-to emoji are one click
    // away. Most-recent first, deduped, capped.
    const RECENT_EMOJIS_KEY = "typingRace.recentEmojis";
    const RECENT_EMOJIS_MAX = 24;
    function loadRecentEmojis() {
      try { return JSON.parse(localStorage.getItem(RECENT_EMOJIS_KEY) || "[]"); }
      catch (e) { return []; }
    }
    function pushRecentEmoji(emoji) {
      let list = loadRecentEmojis().filter((e) => e !== emoji);
      list.unshift(emoji);
      if (list.length > RECENT_EMOJIS_MAX) list = list.slice(0, RECENT_EMOJIS_MAX);
      localStorage.setItem(RECENT_EMOJIS_KEY, JSON.stringify(list));
    }

    // The full palette, grouped by theme. Each entry is a space-separated
    // string just to keep it compact/readable (split on whitespace below).
    // The server accepts any single emoji (see RaceRoom's isEmoji), so this
    // list can grow freely without needing a matching server change.
    const EMOJI_GROUPS = [
      { name: "Smileys & People", icon: "😀", emojis:

    // Group 0 is the dynamic "Recently Used" section (filled on open); the
    // themed groups follow. Tabs and scroll sections are built in parallel so
    // a tab at index i jumps to groupEls[i].
    const PICKER_GROUPS = [{ name: "Recently Used", icon: "🕘", recent: true }, ...EMOJI_GROUPS];

    const emojiTabs = document.createElement("div");
    emojiTabs.id = "emojiTabs";
    const emojiScroll = document.createElement("div");
    emojiScroll.id = "emojiScroll";
    emojiPicker.appendChild(emojiTabs);
    emojiPicker.appendChild(emojiScroll);

    const groupEls = [];
    const tabEls = [];

    function makeEmojiCell(emoji) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "emoji-cell";
      btn.textContent = emoji;
      btn.title = emoji;
      btn.onclick = () => selectEmoji(emoji);
      return btn;
    }

    PICKER_GROUPS.forEach((group, i) => {
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "emoji-tab";
      tab.textContent = group.icon;
      tab.title = group.name;
      tab.onclick = () => scrollToGroup(i);
      emojiTabs.appendChild(tab);
      tabEls.push(tab);

      const section = document.createElement("div");
      section.className = "emoji-group";
      const title = document.createElement("div");
      title.className = "emoji-group-title";
      title.textContent = group.name;
      const grid = document.createElement("div");
      grid.className = "emoji-group-grid";
      section.appendChild(title);
      section.appendChild(grid);
      emojiScroll.appendChild(section);
      groupEls.push(section);

      if (!group.recent) {
        group.emojis.split(/\s+/).filter(Boolean).forEach((emoji) => grid.appendChild(makeEmojiCell(emoji)));
      }
      // The recent group's grid is (re)filled each time the picker opens.
    });

    // Refill the "Recently Used" grid from localStorage. Shows a hint when
    // empty so the section never looks broken on a first visit.
    function refreshRecentGroup() {
      const grid = groupEls[0].querySelector(".emoji-group-grid");
      grid.innerHTML = "";
      const recents = loadRecentEmojis();
      if (recents.length === 0) {
        const empty = document.createElement("div");
        empty.className = "emoji-empty";
        empty.textContent = "No recent emoji yet — pick one below.";
        grid.appendChild(empty);
      } else {
        recents.forEach((emoji) => grid.appendChild(makeEmojiCell(emoji)));
      }
    }

    // Smooth-scroll a group to the top of the scroll area. getBoundingClientRect
    // deltas keep this correct regardless of padding / sticky headers.
    function scrollToGroup(i) {
      const el = groupEls[i];
      const top = el.getBoundingClientRect().top - emojiScroll.getBoundingClientRect().top + emojiScroll.scrollTop;
      emojiScroll.scrollTo({ top, behavior: "smooth" });
    }

    // Highlight the tab of whichever group is currently at the top of the
    // scroll area, so the tabs double as a position indicator.
    function updateActiveTab() {
      const viewTop = emojiScroll.getBoundingClientRect().top;
      let active = 0;
      groupEls.forEach((el, i) => {
        if (el.getBoundingClientRect().top - viewTop <= 12) active = i;
      });
      tabEls.forEach((t, i) => { t.dataset.active = i === active ? "1" : "0"; });
    }
    emojiScroll.addEventListener("scroll", updateActiveTab);

    function updateGridSelection() {
      emojiScroll.querySelectorAll(".emoji-cell").forEach((btn) => {
        btn.dataset.selected = btn.textContent === myEmoji ? "1" : "0";
      });
    }

    function openEmojiPicker() {
      refreshRecentGroup();
      updateGridSelection();
      emojiPicker.dataset.open = "1";
      emojiScroll.scrollTop = 0;
      updateActiveTab();
    }

    function closeEmojiPicker() {
      emojiPicker.dataset.open = "0";
    }

    function selectEmoji(emoji) {
      myEmoji = emoji;
      localStorage.setItem(EMOJI_KEY, myEmoji);
      pushRecentEmoji(emoji);
      emojiBtn.textContent = myEmoji;
      updateGridSelection();
      closeEmojiPicker();
      if (room) room.send("setEmoji", { emoji: myEmoji });

      e.stopPropagation();

      else openEmojiPicker();

    document.addEventListener("mousedown", (e) => {
      if (emojiPicker.dataset.open !== "1") return;
      if (e.target === emojiBtn || emojiPicker.contains(e.target)) return;
      closeEmojiPicker();

    // --- Settings panel (gear icon) -------------------------------------------
    // Holds the username field and the "show racers on text" toggle. Opened
    // from the header gear; behaves like the emoji picker popover (outside
    // click / Escape closes it). Username is saved from the field to
    // localStorage + the server ("setName") whenever it changes - on Enter,
    // and whenever the panel closes - so there's no separate Save button.
    usernameDisplay.textContent = myName; // header label; kept in sync on save

    function saveUsernameFromField() {
      const trimmed = settingsUsername.value.trim().slice(0, 20);
      if (!trimmed || trimmed === myName) return;
      myName = trimmed;
      localStorage.setItem(USERNAME_KEY, myName);
      usernameDisplay.textContent = myName;
      if (room) room.send("setName", { name: myName });
    }

    function openSettings(focusName) {
      settingsUsername.value = myName; // reflect the current name each open
      settingsPanel.dataset.open = "1";
      if (focusName) { settingsUsername.focus(); settingsUsername.select(); }
    }

    function closeSettings() {
      if (settingsPanel.dataset.open !== "1") return;
      saveUsernameFromField(); // commit any pending name edit on close
      settingsPanel.dataset.open = "0";
    }

    function toggleSettings(focusName) {
      if (settingsPanel.dataset.open === "1") closeSettings();
      else openSettings(focusName);
    }

    settingsBtn.onclick = (e) => { e.stopPropagation(); toggleSettings(false); };
    // Clicking (or Enter/Space on) the header name opens Settings, focused on
    // the name field - the old "click your name to change it" affordance.
    usernameDisplay.onclick = (e) => { e.stopPropagation(); toggleSettings(true); };
    usernameDisplay.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleSettings(true); }
    });
    settingsUsername.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        saveUsernameFromField();
        closeSettings();
      } else if (e.key === "Escape") {

      }
    });
    // Click anywhere outside the open panel closes it (and commits the name).
    // The gear and the header name are exempt - they toggle it themselves, so
    // letting this also fire would close-then-reopen (a flicker).
    document.addEventListener("mousedown", (e) => {
      if (settingsPanel.dataset.open !== "1") return;
      if (e.target === settingsBtn || e.target === usernameDisplay || settingsPanel.contains(e.target)) return;
      closeSettings();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeSettings();
    });

    // banner while racing; on by default. Persisted per browser.
    const WPM_KEY = "typingRace.showWpm";
    let showWpm = localStorage.getItem(WPM_KEY);
    showWpm = showWpm === null ? true : showWpm === "1";

    function applyWpmToggleUi() {
      wpmToggle.dataset.on = showWpm ? "1" : "0";
      // Reserve the taller slot only when the WPM display can actually appear,
      // so the countdown->racing swap doesn't shift the text.
      statusSlot.dataset.reserve = showWpm ? "1" : "0";
    }
    applyWpmToggleUi();

    wpmToggle.onclick = () => {
      showWpm = !showWpm;
      localStorage.setItem(WPM_KEY, showWpm ? "1" : "0");
      applyWpmToggleUi();
      if (room) render(room.state); // reflect immediately
    };

    // Sends the full attempt-so-far (committed words + current box) and
    // repaints the colored quote immediately, from local input, not waiting
    // on a server round-trip. Waiting for the round-trip is what made
    // mistyped characters feel laggy: a wrong keystroke usually doesn't
    // change the server-computed progress at all (the matching prefix stalls
    // at the same length), so there was often no state change to re-render
    // from until the next incidental update.
    function sendProgress() {
      if (!room) return;
      lastKeystrokeAt = Date.now();
      paintQuote(room.state.quote);
      room.send("typeProgress", { input: committed + typeInput.value });
    }

    typeInput.oninput = sendProgress;

    // Repaints the cursor on its own cadence (not tied to keystrokes or
    // server broadcasts) so the switch from solid to blinking happens
    // promptly, right around CURSOR_IDLE_BEFORE_BLINK_MS after you stop
    // typing, instead of waiting on the next incidental state update.
    setInterval(() => {
      if (room && !typeInput.disabled && typeInput.dataset.visible === "1") {
        paintQuote(room.state.quote);
      }
    }, 150);

    // Repaint the selection highlight (no server message needed for this,
    // it's purely a local display concern).
    ["select", "mouseup", "keyup"].forEach((evt) => {
      typeInput.addEventListener(evt, () => {
        if (room) paintQuote(room.state.quote);
      });
    });

    // Space locks in the current word and clears the box for the next one,
    // but only if the word typed so far is exactly correct. A wrong word
    // blocks the space instead of committing, so you fix it in place; once
    // locked, a word can't be backspaced into again.
    typeInput.addEventListener("keydown", (e) => {
      if (e.key !== " " || !room) return;
      e.preventDefault();

      const quote = room.state.quote;
      const spaceIdx = quote.indexOf(" ", committed.length);
      if (spaceIdx === -1) return; // final word, no next boundary to commit into

      const expectedWord = quote.slice(committed.length, spaceIdx);
      if (typeInput.value !== expectedWord) return; // not correct yet, space is a no-op

      committed += expectedWord + " ";
      typeInput.value = "";
      sendProgress();
    });

    // --- EXPERIMENTAL: other racers' live carets on your own text --------------
    // Draws a thin caret for every OTHER racer at their live position in the
    // quote, with their picked emoji as a lollipop above it, so you can see the
    // pack move through the text and tell how close you are. Purely a view: it
    // reads the server's already-synced `progress` (caret index ≈ progress ×
    // quote length), so there's no new server state and nothing to desync.
    // Toggleable (many find it distracting); persisted per browser. To revert
    // the whole feature, delete this block plus the CSS/markup/refs marked
    // "EXPERIMENTAL".
    const GHOST_KEY = "typingRace.showGhosts";
    let showGhosts = localStorage.getItem(GHOST_KEY);
    showGhosts = showGhosts === null ? true : showGhosts === "1"; // default on so it's tried

    function applyGhostToggleUi() {
      ghostToggle.dataset.on = showGhosts ? "1" : "0";
      quoteEl.dataset.ghosts = showGhosts ? "1" : "0"; // widens line-height only while on
    }
    applyGhostToggleUi();

    ghostToggle.onclick = () => {
      showGhosts = !showGhosts;
      localStorage.setItem(GHOST_KEY, showGhosts ? "1" : "0");
      applyGhostToggleUi();
      if (room) renderGhostCarets(room.state); // clear or draw immediately
    };

    function renderGhostCarets(state) {
      ghostLayer.innerHTML = "";
      if (!showGhosts || !state || state.phase !== "racing") return;
      const len = (state.quote || "").length;
      // Char spans are 1:1 with the quote; bail if they're not there yet.
      if (len === 0 || quoteEl.children.length < len) return;

      const quoteRect = quoteEl.getBoundingClientRect();
      const fontPx = parseFloat(getComputedStyle(quoteEl).fontSize) || 20;
      const glyphH = fontPx * 1.15;

      // Group racers by caret index so several at the same spot stack their
      // lollipops upward instead of overlapping.
      const byIndex = new Map();
      state.players.forEach((p, sessionId) => {
        if (sessionId === room.sessionId) return; // you already have your own cursor
        if (p.status !== "racing") return;
        let idx = Math.round((p.progress || 0) * len);
        idx = Math.max(0, Math.min(len, idx));
        if (!byIndex.has(idx)) byIndex.set(idx, []);
        byIndex.get(idx).push(p);
      });

      byIndex.forEach((players, idx) => {
        // The char the caret sits before, or the last char's right edge once
        // the racer has finished (idx === len).
        const span = quoteEl.children[idx < len ? idx : len - 1];
        const r = span.getBoundingClientRect();
        const x = (idx < len ? r.left : r.right) - quoteRect.left;
        const caretTop = (r.top - quoteRect.top) + (r.height - glyphH) / 2;

        players.forEach((p, stack) => {
          const caret = document.createElement("div");
          caret.className = "ghost-caret";
          caret.style.left = x + "px";
          caret.style.top = caretTop + "px";
          caret.style.height = glyphH + "px";
          const color = getEmojiColor(p.emoji);
          if (color) caret.style.background = color;

          const emoji = document.createElement("span");
          emoji.className = "ghost-caret-emoji";
          emoji.textContent = p.emoji || "🚀";
          if (stack > 0) emoji.style.bottom = `calc(100% + ${stack * 17}px)`;
          caret.appendChild(emoji);
          ghostLayer.appendChild(caret);
        });
      });
    }

    // Text layout (and thus caret positions) can shift on resize; recompute.
    window.addEventListener("resize", () => { if (room) renderGhostCarets(room.state); });
    // --- end experimental block ------------------------------------------------

    connect();
  </script>
</body>
</html>
